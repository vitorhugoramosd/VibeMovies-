version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibemovies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibemovies
      POSTGRES_PASSWORD: vibemovies_secret
      POSTGRES_DB: vibemovies_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibemovies -d vibemovies_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
